# T-095: the browser security headers of every page and file of the web app (ZAP baseline of 2026-11-26: CSP,
# anti-clickjacking, Permissions-Policy, COOP and CORP were missing). Included in each location of nginx.conf,
# because an add_header inside a location replaces those of the server block.
#
# What the app loads from elsewhere: images from any https host (coin logos, news images, Cloudinary media),
# videos from Cloudinary, direct uploads to api.cloudinary.com, the STOMP socket on this host, and the SePay checkout
# form posted to SePay. No inline script (public/theme-init.js), no eval, no frame, no worker. Inline styles stay
# allowed: React's style attributes and the chart library set them.
#
# Cross-Origin-Embedder-Policy is left out on purpose: require-corp would block the cross-origin images above, which
# do not send Cross-Origin-Resource-Policy.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https://res.cloudinary.com; font-src 'self' data:; connect-src 'self' wss://$host https://api.cloudinary.com; form-action 'self' https://pay-sandbox.sepay.vn https://pay.sepay.vn; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
