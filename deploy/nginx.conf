# The single-page app: every unknown path is the app's own route (React Router), answered with index.html.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Hashed build files never change: cache them for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        # index.html must be read again on each visit, so a new release is picked up.
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
